<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>贺贺的学习笔记 · 以教为学</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 深色主题（默认黑夜）变量 */
        :root {
            --bg-body-start: #0a0c12;
            --bg-body-end: #11161f;
            --bg-card: rgba(20, 26, 36, 0.85);
            --card-border: rgba(56, 68, 88, 0.4);
            --card-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
            --text-primary: #f1f5f9;
            --text-secondary: #b9c7da;
            --text-muted: #7b8a9e;
            --border-light: #2d3440;
            --border-dashed: #2a2f3a;
            --btn-bg: rgba(30, 36, 48, 0.9);
            --btn-border: #334155;
            --btn-hover-bg: #2d3a4e;
            --btn-hover-border: #5b6e8c;
            --accent: #9bb5e6;
            --accent-glow: rgba(155, 181, 230, 0.2);
            --gradient-accent: linear-gradient(135deg, #9bb5e6 0%, #7c93c0 100%);
            --transition-smooth: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        /* 白天模式 */
        [data-theme="light"] {
            --bg-body-start: #eef2f8;
            --bg-body-end: #dfe6ef;
            --bg-card: rgba(255, 255, 255, 0.92);
            --card-border: rgba(148, 163, 184, 0.25);
            --card-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #5b6e8c;
            --border-light: #e2e8f0;
            --border-dashed: #cbd5e1;
            --btn-bg: #ffffff;
            --btn-border: #cfdee9;
            --btn-hover-bg: #eef3fc;
            --btn-hover-border: #a0b3cc;
            --accent: #3b71f0;
            --accent-glow: rgba(59, 113, 240, 0.15);
            --gradient-accent: linear-gradient(135deg, #3b71f0, #5b8cff);
        }

        body {
            background: linear-gradient(135deg, var(--bg-body-start), var(--bg-body-end));
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background 0.3s ease;
            position: relative;
        }

        /* 背景柔光噪点纹理 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 25% 40%, rgba(255,255,240,0.02) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        /* 右上角主题切换按钮 */
        .theme-switch-wrapper {
            position: fixed;
            top: 1.2rem;
            right: 1.4rem;
            z-index: 100;
        }

        .theme-btn {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        .theme-btn:hover {
            transform: scale(1.05);
            background: var(--btn-hover-bg);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .theme-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--text-secondary);
            stroke-width: 1.7;
            fill: none;
            transition: stroke 0.2s;
        }

        [data-theme="light"] .theme-btn .sun-icon,
        .theme-btn .moon-icon { display: none; }
        [data-theme="light"] .theme-btn .moon-icon { display: block; }
        [data-theme="dark"] .theme-btn .sun-icon { display: block; }
        .theme-btn .sun-icon { display: block; }
        .theme-btn .moon-icon { display: none; }
        [data-theme="light"] .theme-btn .sun-icon { display: none; }
        [data-theme="light"] .theme-btn .moon-icon { display: block; }

        .container {
            max-width: 740px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(2px);
            border-radius: 40px;
            box-shadow: var(--card-shadow);
            padding: 2rem 1.8rem;
            transition: var(--transition-smooth);
            border: 1px solid var(--card-border);
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 40px;
            padding: 1px;
            background: linear-gradient(125deg, var(--accent-glow), transparent 70%);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
        }

        @media (min-width: 640px) {
            .card {
                padding: 2.8rem 2.6rem;
            }
        }

        /* 头像区域 - 朴素沙漏，无阴影 */
        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 1.6rem;
        }
        .avatar {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }
        .avatar svg {
            width: 68%;
            height: 68%;
            stroke: var(--accent);
            stroke-width: 1.8;
            fill: none;
        }
        .avatar:hover {
            transform: scale(1.02);
        }

        /* 主引语区域 - 居中，无引号 */
        .quote-wrapper {
            margin-bottom: 2rem;
            text-align: center;
        }
        .quote-text {
            font-size: 1.65rem;
            font-weight: 480;
            line-height: 1.35;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            background: transparent;
            padding: 0;
            transition: color 0.2s;
            display: inline-block;
        }
        @media (min-width: 640px) {
            .quote-text {
                font-size: 2rem;
            }
        }

        /* 分割线 */
        .divider {
            width: 100%;
            height: 1px;
            background: var(--border-light);
            margin: 1.2rem 0 1.5rem 0;
            opacity: 0.6;
        }

        /* 链接区域 - 居中显示 */
        .links-section {
            padding-bottom: 0.5rem;
        }
        .links-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 60px;
            padding: 0.65rem 1.5rem 0.65rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            text-decoration: none;
            transition: var(--transition-smooth);
            backdrop-filter: blur(2px);
            letter-spacing: -0.2px;
        }

        .link-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--accent);
            stroke-width: 1.7;
            fill: none;
            transition: stroke 0.2s, transform 0.2s;
        }

        .link-btn:hover {
            background: var(--btn-hover-bg);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.2);
        }
        .link-btn:hover svg {
            stroke: var(--accent);
            transform: scale(1.02);
        }

        .footer-note {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 430;
            transition: color 0.2s;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-body-start);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 8px;
        }

        @media (max-width: 500px) {
            body {
                padding: 1rem;
            }
            .card {
                padding: 1.6rem;
            }
            .quote-text {
                font-size: 1.4rem;
            }
            .link-btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- 右上角主题切换 -->

        <div class="theme-btn" id="theme-toggle" aria-label="切换白天/黑夜模式">

        </div>
        <div class="footer-note">
            学习 · 记录 · 同行
        </div>
    </div>

    <script>
        (function() {
            const root = document.documentElement;
            let currentTheme = localStorage.getItem('theme') || 'dark';
            function setTheme(theme) {
                if (theme === 'light') {
                    root.setAttribute('data-theme', 'light');
                } else {
                    root.setAttribute('data-theme', 'dark');
                }
                localStorage.setItem('theme', theme);
                currentTheme = theme;
            }
            if (currentTheme === 'light') {
                setTheme('light');
            } else {
                setTheme('dark');
            }
            const toggleBtn = document.getElementById('theme-toggle');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    setTheme(newTheme);
                });
            }
        })();
    </script>

</html>
